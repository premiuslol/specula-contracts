name: Specula isolated candidate validation
on:
  push:
    branches: [validation/specula-candidates-20261009]
permissions:
  contents: read
concurrency:
  group: specula-candidate-validation-20261009
  cancel-in-progress: true
jobs:
  focused-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: issue-9-keep-compat-pin
            sha: 67d885a232710231e7da60ec8a8aa9817b1f5840
          - candidate: issue-3-event-tests
            sha: 59b794c999caa7d9e8324837a449d47ebbcd3eff
          - candidate: issue-7-rustfmt-gate
            sha: ca232618844a52bd7212e6071f2422f8a4c14b0d
          - candidate: issue-4-admin-tests
            sha: fadb2baa18008f8c1372f3ed160e087a98f81b67
          - candidate: issue-5-threshold-tests
            sha: c03053a6eb0a99dc84693a294937468bb00bf58b
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable ref verified 2026-10-09
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Verify commit identity
        run: git rev-parse HEAD
      - name: Existing upstream dependency workaround (except candidate #9)
        if: matrix.candidate != 'issue-9-keep-compat-pin'
        run: cargo update -p ed25519-dalek@3.0.0 --precise 2.1.1
      - name: Format validation for issue #7
        if: matrix.candidate == 'issue-7-rustfmt-gate'
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

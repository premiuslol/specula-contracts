name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          targets: wasm32-unknown-unknown
      - run: cargo update -p ed25519-dalek@3.0.0 --precise 2.1.1
      - run: cargo build --target wasm32-unknown-unknown --release
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
